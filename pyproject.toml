[project]
name = "wedplan-ai"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.8",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.6",
    "pydantic-settings==2.16.1",
    "google-genai==1.3.0",
    "python-dotenv==1.2.4",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "C90", "SIM", "RET", "PTH", "ERA", "T20", "PL"
]
ignore = [
    "E501",   # Line length handled gracefully by formatter
    "B008",   # FastAPI Depends() in endpoint definitions
    "SIM108", # Ternary operator suggestions
    "PLR0913", # Many arguments in domain constructors (e.g. planner)
    "PLR2004", # Magic values in benchmarks/math
    "PLR0911", # Too many return statements in validators
    "PLR0912", # Too many branches (handled by C90 max-complexity)
    "PLR0915", # Too many statements (handled by max lines)
    "PLR0917", # Too many positional arguments (standard in domain calculators)
    "PLC0415", # Imports inside functions (useful for lazy loading/tests)
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["T201", "S101", "PLR2004", "PLR0913"]
"scripts/*" = ["T201", "S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
files = ["backend/app", "api"]

[[tool.mypy.overrides]]
module = ["google.*", "starlette.*", "dotenv.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "strict"
addopts = "-v --cov=backend/app --cov-branch"
