[project]
name = "wedplan-ai"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.8",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.1",
    "google-genai==1.3.0",
    "python-dotenv==1.2.4",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # Line length handled gracefully
    "B008",   # Depends(...) in FastAPI route definitions
    "B904",   # HTTPException raise in handlers
    "SIM108", # Ternary operator suggestions
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "strict"
