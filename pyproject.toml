[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # Line length handled gracefully
    "B008",   # Depends(...) in FastAPI route definitions
    "B904",   # HTTPException raise in handlers
    "SIM108", # Ternary operator suggestions
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "strict"
