name: WedPlan AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov hypothesis ruff mypy httpx

      - name: Run Ruff Linter
        run: python -m ruff check backend api

      - name: Run Mypy Type Checker
        run: python -m mypy backend/app api

      - name: Run Pytest with Coverage
        run: python -m pytest backend/tests --cov=backend/app --cov-report=term-missing

      - name: Run Vercel Simulation Gate
        run: python scripts/simulate_vercel.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  frontend-checks:
    name: Frontend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Run Type Check & Build
        run: |
          cd frontend
          npm run build

      - name: Run Vitest Suite & Axe-Core
        run: |
          cd frontend
          npm test
